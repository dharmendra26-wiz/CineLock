# Server
server.port=8080

# Application Name
spring.application.name=cinelock

# Database Connection (Postgres in Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/cinelock
spring.datasource.username=cinelock
spring.datasource.password=cinelock
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# SQL Debug Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace